name: Pull Request Test Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  verify-pr-tests:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: true
      COVERAGE_FILE: coverage/widget-standalone/lcov.info

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm test -- --watch=false --code-coverage --browsers=ChromeHeadless --no-progress

      - name: Install diff-cover
        run: python -m pip install diff-cover==10.5.1

      - name: Fetch base branch
        run: |
          git remote add upstream "https://github.com/${{ github.event.pull_request.base.repo.full_name }}.git"
          git fetch --no-tags --depth=1 upstream "${{ github.event.pull_request.base.ref }}"

      - name: Verify changed lines are covered by tests
        run: |
          LCOV_FILE="$COVERAGE_FILE"
          if [ ! -f "$LCOV_FILE" ]; then
            echo "$LCOV_FILE was not generated."
            exit 1
          fi

          diff-cover "$LCOV_FILE" --compare-branch="upstream/${{ github.event.pull_request.base.ref }}" --fail-under=100
