name: Pull Request Test Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  verify-pr-tests:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm test -- --watch=false --code-coverage --browsers=ChromeHeadless --no-progress

      - name: Install diff-cover
        run: python -m pip install diff-cover

      - name: Fetch base branch
        run: |
          git fetch --no-tags --prune --depth=1 origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Verify changed lines are covered by tests
        run: |
          LCOV_FILE=$(find coverage -name lcov.info | head -n 1)
          if [ -z "$LCOV_FILE" ]; then
            echo "lcov.info was not generated."
            exit 1
          fi

          diff-cover "$LCOV_FILE" --compare-branch="origin/${{ github.base_ref }}" --fail-under=100
