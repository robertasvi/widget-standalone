name: Update README Summary

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme-summary:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite generated README summary
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');

          const readmePath = 'README.md';
          const startMarker = '<!-- main-branch-summary:start -->';
          const endMarker = '<!-- main-branch-summary:end -->';
          const zeroSha = '0'.repeat(40);
          const before = process.env.BEFORE_SHA;
          const after = process.env.AFTER_SHA;
          const hasBefore = Boolean(before) && before !== zeroSha;

          const git = (args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const commitRange = hasBefore ? `${before}..${after}` : after;
          const fileRange = hasBefore ? `${before}..${after}` : `${after}^!`;
          const escapeMarkdown = (value) =>
            value
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/[`[\]]/g, '\\$&');

          let commitLines = [];
          try {
            commitLines = git(['log', '--reverse', '--pretty=format:%h%x09%s', commitRange])
              .split('\n')
              .filter(Boolean);
          } catch (error) {
            commitLines = git(['log', '--reverse', '--max-count=1', '--pretty=format:%h%x09%s', after])
              .split('\n')
              .filter(Boolean);
          }

          let fileLines = [];
          try {
            fileLines = git(['diff', '--name-only', fileRange])
              .split('\n')
              .filter(Boolean);
          } catch (error) {
            fileLines = git(['show', '--pretty=format:', '--name-only', after])
              .split('\n')
              .filter(Boolean);
          }

          const updatedAt = new Date().toISOString();
          const uniqueFiles = [...new Set(fileLines)];
          const ignoredFiles = new Set(['README.md', '.github/workflows/update-readme-summary.yml']);
          const relevantFiles = uniqueFiles.filter((file) => !ignoredFiles.has(file));

          if (relevantFiles.length === 0) {
            console.log('Skipping README summary update because no relevant files changed.');
            process.exit(0);
          }

          const summaryLines = [
            `_Last updated: ${updatedAt}_`,
            '',
            `- ${commitLines.length} commit(s) included in the latest \`main\` update`,
            `- ${relevantFiles.length} relevant file(s) changed`,
            '',
            '### Commit summaries',
            ...(commitLines.length > 0
              ? commitLines.map((line) => {
                  const [sha, subject] = line.split('\t');
                  return `- \`${sha}\` ${escapeMarkdown(subject ?? '')}`;
                })
              : ['- No commits found.']),
            '',
            '### Changed files',
            ...(relevantFiles.length > 0
              ? relevantFiles.map((file) => `- \`${escapeMarkdown(file)}\``)
              : ['- No files found.']),
          ];

          const generatedBlock = `${startMarker}\n${summaryLines.join('\n')}\n${endMarker}`;
          const readme = fs.readFileSync(readmePath, 'utf8');

          if (readme.includes(startMarker) && readme.includes(endMarker)) {
            const startIndex = readme.indexOf(startMarker);
            const endIndex = readme.indexOf(endMarker) + endMarker.length;
            const updated = `${readme.slice(0, startIndex)}${generatedBlock}${readme.slice(endIndex)}`;
            fs.writeFileSync(readmePath, updated.replace(/\n{3,}/g, '\n\n'));
          } else {
            const separator = readme.endsWith('\n') ? '' : '\n';
            fs.writeFileSync(readmePath, `${readme}${separator}\n${generatedBlock}\n`);
          }
          NODE

      - name: Commit README changes
        run: |
          if git diff --quiet -- README.md; then
            echo "README is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update README summary"
          git push
